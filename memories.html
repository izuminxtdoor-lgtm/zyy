<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" autoplay loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Falling Hearts -->
    <div id="hearts-container"></div>

    <main class="page">

        <div class="glass-card page-card fade">

            <h1 class="title">
                📸 Our Memories
            </h1>

            <p class="subtitle">
                Every picture holds a beautiful memory,
                and every memory reminds us how special this journey has been.
            </p>

            <div class="gallery">

                <div class="photo-card">
                    <img src="pic1.jpg" alt="Memory 1">
                    
                </div>

                <div class="photo-card">
                    <img src="pic2.jpg" alt="Memory 2">
                    
                </div>

                <div class="photo-card">
                    <img src="pic3.jpg" alt="Memory 3">
                    
                </div>

                <div class="photo-card">
                    <img src="pic4.jpg" alt="Memory 4">
                    
                </div>

                <div class="photo-card">
                    <img src="pic5.jpg" alt="Memory 5">
                    
                </div>

                <div class="photo-card">
                    <img src="pic6.jpg" alt="Memory 6">
                    
                </div>

            </div>

            <button class="btn"
                onclick="location.href='menu.html'">
                ⬅ Back to Menu
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
